name: live

# Integration tests against the real Parallax endpoints: nightly, and on
# demand. Failures here mean an endpoint changed or is down, not
# necessarily a bug in this repository.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make live
