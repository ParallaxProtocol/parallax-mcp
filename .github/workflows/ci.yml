name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER: v1.8.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Validate server.json
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Embed the current docs and PIPs rather than the snapshot committed
      # here, so a release never ships documentation older than the site.
      - uses: actions/checkout@v4
        with:
          repository: ParallaxProtocol/parallax
          ref: main
          path: .parallax
      - name: Refresh the embedded docs and PIPs
        env:
          GH_TOKEN: ${{ github.token }}
          PARALLAX_REPO: .parallax
        run: |
          git -C .parallax checkout -q -B main
          scripts/sync-content.sh main
          git status --short internal/resources/content | head -20
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/parallax-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/parallax-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishes server.json to the MCP Registry for version tags, after the
  # image carrying the ownership label is pushed. GitHub OIDC grants the
  # io.github.ParallaxProtocol namespace to workflows of this organization.
  registry:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/parallaxprotocol/parallax-mcp:\($v)"' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  # Redeploys the public server through Coolify's deploy webhook once a
  # release image is published. It runs only when the COOLIFY_WEBHOOK and
  # COOLIFY_TOKEN repository secrets are set; the Coolify resource should
  # track the "latest" tag (or "0.1" for patch releases only).
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK or COOLIFY_TOKEN is not set; skipping the deployment"
            exit 0
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
          echo
          # Wait for the new version to answer.
          want="${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            sleep 20
            got=$(curl -fsS -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              https://mcp.parallaxprotocol.org/mcp | sed -n 's/^data: //p' | jq -r '.result.serverInfo.version' || true)
            echo "attempt $i: serving $got"
            [ "$got" = "$want" ] && exit 0
          done
          echo "the server still does not report $want after 10 minutes" >&2
          exit 1
