# parallax-mcp configuration. Every key can also be set with a flag
# (--rpc-url) or an environment variable (PARALLAX_MCP_RPC_URL); flags win
# over the environment, which wins over this file.

transport: http            # stdio or http
http_addr: 0.0.0.0:8080
http_path: /mcp
http_stateless: false      # true: no sessions (no subscriptions), for load-balanced replicas
head_poll_interval: 15s    # while clients are subscribed to parallax://chain/head or waiting

rpc_url: https://rpc.parallaxprotocol.org   # a node with debug/txpool/admin/xhash enables more tools
explorer_url: https://explorer.parallaxprotocol.org
# explorer_stats_url: https://explorer.parallaxprotocol.org/stats-service
status_url: https://status.parallaxprotocol.org
chain_id: 2110

# Tool groups: chain, mining, explorer, network, mempool, tx.
# tx (build/decode transactions) is off by default.
groups: [chain, mining, explorer, network, mempool]

# The only switch that registers broadcast_signed_tx. Keep it off for a
# public deployment.
allow_broadcast: false

# Per-client limits on the http transport.
rate_limit: 2              # sustained requests per second per client address
rate_burst: 20
max_concurrent: 64
trusted_proxies: []        # e.g. [10.0.0.0/8] behind a reverse proxy; enables X-Forwarded-For

metrics_addr: ""           # e.g. 127.0.0.1:9090 to serve Prometheus /metrics
log_level: info
log_format: json

backend_timeout: 15s
tool_timeout: 45s
backend_retries: 2
status_cache_ttl: 15s
max_response_bytes: 262144
max_log_range: 10000
max_logs: 500
